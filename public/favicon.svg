<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="maroonGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B0019" />
      <stop offset="70%" stop-color="#5A000F" />
      <stop offset="100%" stop-color="#360008" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Royal Circular Background -->
  <circle cx="32" cy="32" r="31" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#E5C158" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.8" />

  <!-- Lord Ganesha Form in Pure Royal Gold -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mukut / Crown -->
    <path d="M32 9 L28 17 L36 17 Z" fill="url(#goldGrad)" stroke-width="0.8" />
    <path d="M26 16 Q32 12 38 16" stroke-width="1.2" />
    <circle cx="32" cy="8" r="1.3" fill="url(#goldGrad)" stroke="none" />

    <!-- Head & Ears -->
    <!-- Left Ear -->
    <path d="M24 22 C16 18 14 28 22 31" stroke-width="2.2" />
    <!-- Right Ear -->
    <path d="M40 22 C48 18 50 28 42 31" stroke-width="2.2" />

    <!-- Forehead arc & Tilak -->
    <path d="M25 21 Q32 17 39 21" stroke-width="1.8" />
    <!-- Sacred Tilak / Trikund -->
    <path d="M30 19 L34 19" stroke-width="1" />
    <circle cx="32" cy="22" r="1.2" fill="url(#goldGrad)" stroke="none" />

    <!-- Trunk (S-Curve flowing to left with Modak) -->
    <path d="M32 23 C33 30 33 37 28 42 C24 45 19 43 20 39 C21 36 24 37 25 38" stroke-width="2.6" />

    <!-- Right Tusk -->
    <path d="M38 30 L36 34" stroke-width="1.6" />

    <!-- Little Modak on Trunk / Left Hand -->
    <circle cx="18.5" cy="38.5" r="1.8" fill="url(#goldGrad)" stroke="none" />

    <!-- Lower Auspicious Arc / Body Base -->
    <path d="M25 46 Q32 51 39 46" stroke-width="2.2" />
    <path d="M22 43 Q32 55 42 43" stroke-width="1.2" opacity="0.7" />
  </g>
</svg>
